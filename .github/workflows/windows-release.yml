name: Windows release

# Desktop build for Windows on every push to main. The runner image carries the
# Visual Studio C++ toolchain Flutter needs; the output is a portable folder
# zipped as an artifact, so a Windows build exists without a local VS install.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # pin — must match the dev machine
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package portable folder
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath Shuro-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuro-windows-x64
          path: Shuro-windows-x64.zip
          if-no-files-found: error
