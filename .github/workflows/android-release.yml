name: Android release

# Every push to main: validate the project, build the signed release APK,
# and publish it as a GitHub prerelease tagged with the pubspec version.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit-notes step

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter version
        run: flutter --version

      - name: Analyze
        # Infos/warnings don't gate the release — errors do.
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Collect release notes
        run: |
          {
            echo "### Shuro v${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})"
            echo ""
            echo "- Commit: \`${{ steps.version.outputs.short_sha }}\`"
            echo "- Date: ${{ steps.version.outputs.date }}"
            echo "- SHA-256: pending upload"
            echo ""
            echo "**Changes in this build**"
            echo ""
            SINCE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$SINCE" ]; then
              git log --pretty=format:'- %s (%h)' "$SINCE"..HEAD
            else
              git log --pretty=format:'- %s (%h)'
            fi
          } > release_notes.md
          # Replace the pending checksum placeholder with the real digest.
          CHECKSUM=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)
          sed -i "s/pending upload/$CHECKSUM/" release_notes.md

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "Shuro_v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuro_v${{ steps.version.outputs.version }}-apk
          path: Shuro_v${{ steps.version.outputs.version }}.apk

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Shuro_v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: "Shuro v${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          prerelease: true
          files: Shuro_v${{ steps.version.outputs.version }}.apk
