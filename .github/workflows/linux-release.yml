name: Linux release

# Desktop build for Linux on every push to main. Produces a self-contained
# bundle directory (binary, libraries, data) tarballed as an artifact.
# Playback on Linux uses the platform backend configured in main.dart; see the
# README for the current state.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # pin — must match the dev machine
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package bundle
        run: |
          tar -czf Shuro-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuro-linux-x64
          path: Shuro-linux-x64.tar.gz
          if-no-files-found: error
