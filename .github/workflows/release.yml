name: Release (Android · Windows · Linux)

# One workflow builds every platform and publishes ONE prerelease containing
# all four artifacts: the signed APK, the Play App Bundle, the portable
# Windows folder (zip) and the Linux bundle (tar.gz).
#
# A single workflow (rather than one per platform) is what makes the release
# atomic: three parallel workflows would race to create the same tag, and
# desktop assets could land on a different release than the APK.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Stage artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "Shuro_v${{ steps.version.outputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "Shuro_v${{ steps.version.outputs.version }}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Shuro_v${{ steps.version.outputs.version }}.apk
            Shuro_v${{ steps.version.outputs.version }}.aab
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package portable folder
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath Shuro-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Shuro-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libmpv-dev mpv

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package bundle
        run: |
          tar -czf Shuro-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Shuro-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    # Publish whatever built. A failed desktop job must not hide the APK.
    needs: [android, windows, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease with every platform
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Shuro_v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: "Shuro v${{ steps.version.outputs.version }}"
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            dist/Shuro_v${{ steps.version.outputs.version }}.apk
            dist/Shuro_v${{ steps.version.outputs.version }}.aab
            dist/Shuro-windows-x64.zip
            dist/Shuro-linux-x64.tar.gz
          body: |
            **Shuro v${{ steps.version.outputs.version }}** (build ${{ github.run_number }})

            - Commit: `${{ steps.version.outputs.sha }}`
            - Date: ${{ steps.version.outputs.date }}

            ### Downloads
            - **Android**: `Shuro_v${{ steps.version.outputs.version }}.apk` (install directly) · `.aab` (Play upload)
            - **Windows**: `Shuro-windows-x64.zip` — extract anywhere, run `shuro.exe`
            - **Linux**: `Shuro-linux-x64.tar.gz` — extract, run `./shuro` (needs GTK 3 + libmpv)

      - name: Prune old prereleases (keep latest 5)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 5;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            const ours = releases
              .filter(r => r.prerelease && /^Shuro_v.*-build\.\d+$/.test(r.tag_name))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const r of ours.slice(keep)) {
              core.info(`Deleting old release: ${r.tag_name}`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${r.tag_name}` })
                .catch(() => {});
            }
